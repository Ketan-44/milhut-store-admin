<div class="app-modal-backdrop" (click)="close()"></div>

<div class="app-modal" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title">
  <div class="app-modal-header d-flex justify-content-between align-items-center">
    <h5 id="profile-modal-title" class="mb-0">Profile</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
  </div>

  <div class="app-modal-body">
    <div class="app-detail-row">
      <span class="app-detail-label">Name</span>
      <span>{{ user()?.name ?? '—' }}</span>
    </div>
    <div class="app-detail-row">
      <span class="app-detail-label">Email</span>
      <span>{{ user()?.email ?? '—' }}</span>
    </div>
    <div class="app-detail-row">
      <span class="app-detail-label">Role</span>
      <span>{{ getRoleName(user()?.role) | titlecase }}</span>
    </div>
  </div>

  <div class="app-modal-footer d-flex justify-content-end">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Close</button>
  </div>
</div>
